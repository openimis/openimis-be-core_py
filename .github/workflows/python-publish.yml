# Publishes the module to PyPI when a release is created, with the release tag as version.
# The steps live in the shared workflow openimis/openimis-be_py/.github/workflows/module-pypi-publish.yml

name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.12.0)'
        required: true

jobs:
  publish:
    uses: openimis/openimis-be_py/.github/workflows/module-pypi-publish.yml@develop
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
